# Move to .github/dependabot.yml (remote file tools can't write into .github/).
# Opens a pull request when a dependency has a security fix or a new version, weekly.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups: { rust: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups: { ui: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

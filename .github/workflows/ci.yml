name: ci
on:
  push:
  pull_request:
  # Weekly, so a newly published advisory shows up even when nothing changed here.
  schedule: [{ cron: "0 9 * * 1" }]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui check
      - run: pnpm --dir ui build
      - run: pnpm --dir ui test
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --locked --bin worthwatch
      # Smoke flow against the real binary (add account -> check-in -> chart; hand edit -> reload).
      - run: pnpm --dir ui exec playwright install --with-deps chromium
      - run: pnpm --dir ui e2e

  # Known vulnerabilities in what Worthwatch is built from (RustSec and the npm advisory DB).
  # Fails on a vulnerable crate, or on an npm advisory rated high or critical.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: cargo audit
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pnpm --dir ui audit --audit-level high

  # The container image Worthwatch runs in. Catches a base-image bump that breaks the build.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file deploy/Dockerfile --tag worthwatch:ci .

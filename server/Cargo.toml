[package]
name = "worthwatch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted net worth and portfolio tracker: one binary, your data in one folder"
default-run = "worthwatch"

[[bin]]
name = "worthwatch"
path = "src/main.rs"

[dependencies]
ledger.workspace = true
derive.workspace = true
providers.workspace = true
holdings.workspace = true
importers.workspace = true
assistant.workspace = true
budget.workspace = true
ureq = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tar = "0.4"
flate2 = "1"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rust_decimal_macros.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[package]
name = "worthwatch"
version.workspace = true
edition.workspace = true
description = "Self-hosted net worth and portfolio tracker: one binary, your data in one folder"
default-run = "worthwatch"

[[bin]]
name = "worthwatch"
path = "src/main.rs"

[dependencies]
ledger = { path = "../crates/ledger" }
derive = { path = "../crates/derive" }
providers = { path = "../crates/providers" }
holdings = { path = "../crates/holdings" }
importers = { path = "../crates/importers" }
assistant = { path = "../crates/assistant" }
budget = { path = "../crates/budget" }
ureq = { version = "2", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tar = "0.4"
flate2 = "1"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rust_decimal_macros = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[workspace]
resolver = "2"
members = ["crates/ledger", "crates/budget", "crates/derive", "crates/holdings", "crates/providers", "crates/importers", "crates/assistant", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
rust_decimal = { version = "1.43", features = ["serde-with-str", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
mime_guess = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
